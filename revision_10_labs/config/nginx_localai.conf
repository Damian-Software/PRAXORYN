# /etc/nginx/conf.d/localai.conf (included in the http{} context)
# Lab configuration: loopback-only, no public access and no request-body logging.
log_format localai_min '$time_iso8601 $request_method $status '
                       '$request_time $upstream_response_time';
limit_req_zone $binary_remote_addr zone=localai_rate:10m rate=3r/s;
server {
    listen 127.0.0.1:8080;
    server_name localhost;
    access_log /var/log/nginx/localai_access.log localai_min;
    error_log /var/log/nginx/localai_error.log warn;
    client_max_body_size 1m;
    limit_req zone=localai_rate burst=6 nodelay;
    add_header Cache-Control 'no-store' always;
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
        proxy_send_timeout 30s;
        proxy_buffering off;
    }
}
