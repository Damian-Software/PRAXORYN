# Example Nginx server block for local pilot only.
# Copy into an existing HTTP context and replace PHP socket after verification.
server {
    listen 127.0.0.1:8090;
    server_name localhost;
    root /var/www/localai/public;
    index index.php;
    autoindex off;
    client_max_body_size 64k;
    add_header Cache-Control 'no-store' always;
    auth_basic 'Local AI pilot';
    auth_basic_user_file /etc/nginx/localai.htpasswd;

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param REMOTE_USER $remote_user;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock; # Verify installed socket; do not assume version.
    }
    location / { return 404; }
    location ~ /\. { deny all; }
}
