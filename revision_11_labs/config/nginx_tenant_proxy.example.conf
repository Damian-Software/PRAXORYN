# Example location fragment, not a complete server configuration.
# Deploy only behind a trusted authentication and authorization gateway.
# Never trust unverified X-Tenant-ID headers supplied by clients.
limit_req_zone $binary_remote_addr zone=client_request_rate:10m rate=3r/s;
server {
    listen 127.0.0.1:9009;
    server_name localhost;
    access_log off;  # Replace with an approved, data-minimal metrics format.
    location /v1/ {
        limit_req zone=client_request_rate burst=6 nodelay;
        client_max_body_size 1m;
        proxy_read_timeout 120s;
        proxy_set_header Authorization "";
        # Upstream key injection belongs in a protected secret-aware gateway;
        # this sample deliberately does not forward public requests to a model.
        return 403;
    }
}
