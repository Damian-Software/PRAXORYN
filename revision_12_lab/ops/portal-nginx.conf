# /etc/nginx/sites-available/local-ai-portal.conf
# Loopback only. Configure TLS and network policy before any LAN/Internet access.
limit_req_zone $binary_remote_addr zone=local_ai_req:10m rate=4r/m;
server {
    listen 127.0.0.1:8090;
    server_name localhost;
    root /var/www/local-ai/public;
    index index.html;
    client_max_body_size 8k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location = / { try_files /index.html =404; }
    location = /api/chat.php {
        limit_req zone=local_ai_req burst=3 nodelay;
        include /etc/nginx/snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    }
    location / { return 404; }
    location ~ \.php$ { return 404; }
}
