# Place in /etc/nginx/sites-available/local-ai-gateway.conf.
# This loopback-only example is NOT an internet TLS termination configuration.
server {
    listen 127.0.0.1:8091;
    server_name localhost;
    root /opt/local-ai-gateway/app/public;
    client_max_body_size 16k;
    access_log off;

    location = /v1/chat/completions {
        limit_except POST { deny all; }
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/local-ai-gateway/app/public/index.php;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_param HTTP_IDEMPOTENCY_KEY $http_idempotency_key;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_connect_timeout 3s;
        fastcgi_read_timeout 75s;
    }
    location / { return 404; }
}
