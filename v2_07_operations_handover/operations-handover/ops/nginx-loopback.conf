# Local lab only. Not a public ingress template.
server {
    listen 127.0.0.1:8188;
    server_name localhost;
    access_log off;
    location /health {
        proxy_pass http://127.0.0.1:8080/health;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }
    location / { return 404; }
}
